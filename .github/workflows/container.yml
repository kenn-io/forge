name: Container

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/container.yml
      - '**/*.go'
      - go.mod
      - go.sum
      - frontend/**
      - packages/**
      - package.json
      - bun.lock
      - scripts/container-*
      - scripts/build-frontend.mjs
      - scripts/check-asset-base-paths.mjs
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: container-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.16.0'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - name: Install Bun for dependencies
        run: |
          curl -fsSL https://bun.sh/install | bash -s 'bun-v1.4.0'
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - name: Build image
        run: |
          build_date=$(git show -s --format=%cI HEAD | date -u -f - +%Y-%m-%dT%H:%M:%SZ)
          docker buildx build --load --build-arg "REVISION=$GITHUB_SHA" \
            --build-arg "BUILD_DATE=$build_date" --tag forge-container-test:local .
      - name: Build arm64 image
        run: docker buildx build --platform linux/arm64 --output type=oci,dest=/tmp/forge-arm64.tar .
      - name: Test direct startup and embedded UI
        env:
          UV_THREADPOOL_SIZE: '2'
          RAYON_NUM_THREADS: '2'
        run: |
          bun install --frozen-lockfile
          node node_modules/.bin/playwright install --with-deps chromium
          scripts/container-smoke.sh forge-container-test:local

  publish:
    if: github.repository == 'kenn-io/forge' && github.event_name == 'release' && !github.event.release.prerelease && !github.event.release.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate stable release and source
        id: source
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git merge-base --is-ancestor HEAD origin/main
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(git show -s --format=%cI HEAD | date -u -f - +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Publish version image
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ACTOR: ${{ github.actor }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REVISION: ${{ steps.source.outputs.revision }}
          BUILD_DATE: ${{ steps.source.outputs.date }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GH_ACTOR" --password-stdin
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            --build-arg "VERSION=$RELEASE_TAG" --build-arg "REVISION=$REVISION" \
            --build-arg "BUILD_DATE=$BUILD_DATE" --tag "ghcr.io/kenn-io/forge:$RELEASE_TAG" .
  promote:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: forge-container-stable-latest
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Reconcile current stable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GH_ACTOR" --password-stdin
          scripts/container-promote.sh
