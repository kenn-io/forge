name: Roborev image builder validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e2e-roborev:
    runs-on: namespace-profile-linux-16cpu
    # A healthy run takes about five minutes. A stalled Debian mirror during the
    # roborev image build once held this job for the six-hour default limit.
    timeout-minutes: 30
    env:
      # Pin to v0.66.0; managed-clone initialization requires v0.65.0 or newer.
      ROBOREV_REF: 45707642fae0b548427b5154836fa0ac10106309
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: roborev-dev/roborev
          ref: ${{ env.ROBOREV_REF }}
          path: .roborev-src
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Cache Bun package downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'package.json', 'frontend/package.json', 'packages/*/package.json') }}

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          version: "1.0.0"
          node-version-file: package.json
          cache: false
          run-install: true

      - name: Set up isolated roborev image builder
        id: roborev-builder
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          driver: docker-container
          driver-opts: |
            image=moby/buildkit:v0.34.0
            default-load=true

      - name: Run roborev E2E tests
        env:
          BUILDX_BUILDER: ${{ steps.roborev-builder.outputs.name }}
          ROBOREV_SRC: ${{ github.workspace }}/.roborev-src
        run: ./scripts/run-roborev-e2e.sh

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: roborev-e2e-report
          path: frontend/test-results/
          retention-days: 7
