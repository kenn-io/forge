host = "127.0.0.1"
port = 8091
# Federation traffic reaches the TLS listener at the Docker service name.
allowed_hosts = ["member:18091"]
data_dir = "/data/member"
sync_interval = "1h"
github_token_env = "KENN_FORGE_GITHUB_TOKEN_UNSET_FOR_FLEET_E2E"

[[platforms]]
type = "github"
host = "member:9418"
token_env = "KENN_FORGE_FLEET_E2E_GIT_TOKEN"

[activity]
view_mode = "threaded"
time_range = "7d"

[terminal]

[fleet]
enabled = true
role = "hub"
base_url = "https://member:18091"
peer_timeout = "1s"

[api]
require_auth = true

[[agents]]
key = "drive-helper"
label = "Drive helper"
command = ["sh", "-lc", "printf drive-helper-ready; sleep 300"]
