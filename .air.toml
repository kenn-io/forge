root = "."
tmp_dir = "tmp"

[build]
cmd = "./scripts/dev-backend-build.sh"
entrypoint = "./tmp/kenn-forge"
delay = 500
exclude_dir = [
  "frontend",
  "internal/web/dist",
  "internal/apiclient/generated",
  "node_modules",
  "target",
  "tmp",
  "vendor",
  ".git",
]
include_ext = ["go", "tpl", "tmpl", "html"]
# The schema-constraints generator feeds dev-backend-build.sh but is not a Go
# file, so Air must watch it explicitly.
include_file = ["scripts/generate-schema-constraints.mjs"]
stop_on_error = true
send_interrupt = true
kill_delay = "2s"

[screen]
clear_on_rebuild = false
