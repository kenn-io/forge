<!doctype html>
<html lang="en" data-kit-theme="quiet">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>kenn-forge</title>
    <style>
      /* Critical theme colors inlined to prevent flash before app.css loads */
      html {
        background: #bfccdc;
      }
      html.dark {
        background: #151618;
        color-scheme: dark;
      }
      html[data-kit-theme="e-reader"] {
        background: #fff;
        color-scheme: light;
      }
    </style>
    <script>
      // Apply theme before first paint to avoid flash of wrong theme.
      (function () {
        try {
          var v = localStorage.getItem("kenn-forge-theme");
          var reader = localStorage.getItem("kenn-forge-theme-name") === "e-reader";
          var contrast = localStorage.getItem("kenn-forge-theme-high-contrast") === "true";
        } catch (e) {
          var v = null;
        }
        var dark = v === "dark" || v === "light" ? v === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        if (reader) document.documentElement.dataset.kitTheme = "e-reader";
        if (dark && !reader) document.documentElement.classList.add("dark");
        if (contrast) document.documentElement.classList.add("high-contrast");
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
