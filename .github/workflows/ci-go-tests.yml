name: CI Go Tests

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ci-go-tests.yml
      - '**/*.go'
      - go.mod
      - go.sum
      - internal/apiclient/generated/**
      - internal/db/migrations/**
      - internal/web/**
      - tests/integration/**
      - Makefile
  pull_request:
    paths:
      - .github/workflows/ci-go-tests.yml
      - '**/*.go'
      - go.mod
      - go.sum
      - internal/apiclient/generated/**
      - internal/db/migrations/**
      - internal/web/**
      - tests/integration/**
      - Makefile
  workflow_dispatch:

permissions:
  checks: write
  contents: read
  issues: read
  pull-requests: read
  statuses: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test_go:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417  # v6.3.0
        with:
          go-version-file: go.mod

      - name: Stub frontend embed dir
        run: |
          mkdir -p internal/web/dist
          echo ok > internal/web/dist/stub.html

      - name: Run tests
        run: |
          mkdir -p tmp
          go tool gotestsum --format pkgname-and-test-fails --jsonfile=tmp/test-output.json -- ./... -shuffle=on

      - name: Publish unit test report
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: dorny/test-reporter@df6247429542221bc30d46a036ee47af1102c451  # v2.7.0
        with:
          name: Go unit tests
          path: tmp/test-output.json
          reporter: golang-json
          fail-on-error: false

      - name: Run live GraphQL validation
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MIDDLEMAN_LIVE_GITHUB_TESTS: "1"
        run: |
          mkdir -p tmp
          go tool gotestsum --format pkgname-and-test-fails --jsonfile=tmp/test-graphql-output.json -- ./internal/github -run TestLiveGraphQLQueriesValidateAgainstGitHub -shuffle=on

      - name: Publish live GraphQL test report
        if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: dorny/test-reporter@df6247429542221bc30d46a036ee47af1102c451  # v2.7.0
        with:
          name: Go live GraphQL tests
          path: tmp/test-graphql-output.json
          reporter: golang-json
          fail-on-error: false

      - name: Run integration tests (git-dependent)
        run: |
          mkdir -p tmp
          go tool gotestsum --format pkgname-and-test-fails --jsonfile=tmp/test-integration-output.json -- -tags integration ./... -shuffle=on

      - name: Publish integration test report
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: dorny/test-reporter@df6247429542221bc30d46a036ee47af1102c451  # v2.7.0
        with:
          name: Go integration tests
          path: tmp/test-integration-output.json
          reporter: golang-json
          fail-on-error: false

  race:
    name: go test -race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417  # v6.3.0
        with:
          go-version-file: go.mod

      - name: Stub frontend embed dir
        run: |
          mkdir -p internal/web/dist
          echo ok > internal/web/dist/stub.html

      - name: Run tests (race detector)
        run: |
          mkdir -p tmp
          go tool gotestsum --format pkgname-and-test-fails --jsonfile=tmp/test-race-output.json --jsonfile-timing-events=tmp/test-race-timing-events.json -- -race ./... -shuffle=on -parallel=2 -timeout 20m

      - name: Summarize race test timings
        if: ${{ !cancelled() && hashFiles('tmp/test-race-output.json') != '' }}
        run: |
          {
            echo "## Slowest race packages"
            echo
            echo '```'
            jq -r '
              select(.Action == "pass" and .Package and (.Test | not) and .Elapsed)
              | "\(.Elapsed)s\t\(.Package)"
            ' tmp/test-race-timing-events.json | sort -rn | head -n 30
            echo '```'
            echo
            echo "## Slowest race tests"
            echo
            echo '```'
            jq -r '
              select(
                (.Action == "pass" or .Action == "fail" or .Action == "skip")
                and .Package
                and .Test
                and .Elapsed
              )
              | "\(.Elapsed)s\t\(.Package)\t\(.Test)"
            ' tmp/test-race-timing-events.json | sort -rn | head -n 40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish race test report
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: dorny/test-reporter@df6247429542221bc30d46a036ee47af1102c451  # v2.7.0
        with:
          name: Go race tests
          path: tmp/test-race-output.json
          reporter: golang-json
          fail-on-error: false

      - name: Upload race timing artifacts
        if: ${{ !cancelled() && hashFiles('tmp/test-race-output.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: go-race-timing
          path: |
            tmp/test-race-output.json
            tmp/test-race-timing-events.json
          retention-days: 7
