sync_interval = "5m"
# Environment variable containing your GitHub personal access token.
# Required scopes: repo (private repos) or public_repo (public only).
github_token_env = "KENN_FORGE_GITHUB_TOKEN"

# Advanced: fine-grained PATs can be selected by exact GitHub owner. These
# entries are configured in TOML only; token_file is checked before token_env.
# [[github_owner_tokens]]
# owner = "my-organization"
# token_env = "KENN_FORGE_GITHUB_TOKEN_MY_ORGANIZATION"

# Host treated as implicit in repository UI labels
default_platform_host = "github.com"
host = "127.0.0.1"
port = 8091

# Style of branch name created for new issue workspaces. "slug" (default)
# appends a sanitized slug derived from the issue title onto the bare
# kenn-forge/issue-<n> form, e.g. kenn-forge/issue-1234-add-foo-to-bar.
# Set to "bare" to keep the legacy kenn-forge/issue-<n> form.
# issue_workspace_branch_style = "slug"

[terminal]

[activity]
view_mode = "threaded"
time_range = "7d"
collapse_threads = true

[[platforms]]
type = "gitlab"
host = "gitlab.com"
token_env = "KENN_FORGE_GITLAB_TOKEN"

# Tokens are selected by provider and host. Read access is enough for sync;
# write access is needed only for comments, state edits, approvals, and merges.
[[platforms]]
type = "forgejo"
host = "codeberg.org"
token_env = "KENN_FORGE_FORGEJO_TOKEN"

[[platforms]]
type = "forgejo"
host = "forgejo.internal.example"
token_env = "FORGEJO_INTERNAL_TOKEN"

[[platforms]]
type = "gitea"
host = "gitea.com"
token_env = "KENN_FORGE_GITEA_TOKEN"

[[platforms]]
type = "gitea"
host = "gitea.internal.example"
token_env = "GITEA_INTERNAL_TOKEN"

[[repos]]
owner = "apache"
name = "arrow"

[[repos]]
owner = "ibis-project"
name = "ibis"

[[repos]]
platform = "gitlab"
platform_host = "gitlab.com"
# GitLab owner can include nested namespaces. repo_path is optional when it is
# exactly owner/name, but useful when preserving provider-canonical casing.
owner = "my-group/subgroup"
name = "my-project"
repo_path = "my-group/subgroup/my-project"

[[repos]]
platform = "forgejo"
platform_host = "codeberg.org"
owner = "forgejo"
name = "forgejo"

[[repos]]
platform = "forgejo"
platform_host = "forgejo.internal.example"
owner = "team"
name = "service"

[[repos]]
platform = "gitea"
platform_host = "gitea.com"
owner = "gitea"
name = "tea"

[[repos]]
platform = "gitea"
platform_host = "gitea.internal.example"
owner = "team"
name = "ops"
