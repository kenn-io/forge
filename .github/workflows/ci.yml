name: CI

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ci.yml
      - '**/*.go'
      - go.mod
      - go.sum
      - internal/apiclient/generated/**
      - internal/db/migrations/**
      - internal/web/**
      - tests/integration/**
      - frontend/**
      - packages/**
      - package.json
      - bun.lock
      - vite.config.ts
      - scripts/e2e/**
      - scripts/run-roborev-e2e.sh
      - Makefile
  pull_request:
    paths:
      - .github/workflows/ci.yml
      - '**/*.go'
      - go.mod
      - go.sum
      - internal/apiclient/generated/**
      - internal/db/migrations/**
      - internal/web/**
      - tests/integration/**
      - frontend/**
      - packages/**
      - package.json
      - bun.lock
      - vite.config.ts
      - scripts/e2e/**
      - scripts/run-roborev-e2e.sh
      - Makefile
  workflow_dispatch:

permissions:
  checks: write
  contents: read
  issues: read
  pull-requests: read
  statuses: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417  # v6.3.0
        with:
          go-version-file: go.mod

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@2dec1e33f4ab2c6d5bce1b0c4607961bb1a3f7a1  # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Stub frontend embed dir
        run: |
          mkdir -p internal/web/dist
          echo ok > internal/web/dist/stub.html

      - name: Run frontend tooling checks
        run: vp run -w check

      - name: Run guardrail checks
        run: make guardrail-check

      - uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20  # v9.2.0
        with:
          version: v2.10.1

      - name: Install NilAway
        run: |
          go install go.uber.org/nilaway/cmd/nilaway@v0.0.0-20260318203545-ad240b12fb4c
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run NilAway
        run: make nilaway

  test_frontend:
    name: Frontend unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@2dec1e33f4ab2c6d5bce1b0c4607961bb1a3f7a1  # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Run frontend unit tests
        run: cd frontend && vp test run --project unit

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417  # v6.3.0
        with:
          go-version-file: go.mod

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@2dec1e33f4ab2c6d5bce1b0c4607961bb1a3f7a1  # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Build frontend
        run: cd frontend && vp build --logLevel warn

      - name: Embed frontend
        run: |
          rm -rf internal/web/dist
          cp -r frontend/dist internal/web/dist

      - name: Build binary
        run: go build -o middleman ./cmd/middleman

  e2e:
    runs-on: ubuntu-latest
    # Run inside the official Playwright image: browsers and their OS deps are
    # pre-baked at $PLAYWRIGHT_BROWSERS_PATH, so there is no apt download to
    # time out on (the firefox `--with-deps` install repeatedly flirted with the
    # old 10m cap off a slow mirror). Pinned by digest like the actions above so
    # a bot can bump it; the trailing comment records the version, which
    # `make playwright-version-check` keeps locked to the @playwright/test pin.
    container: mcr.microsoft.com/playwright@sha256:57b65fdc9ceabe0ef613124c7bbe2babcf9362c4d85e382fe3b03604e84b428a  # v1.61.0-noble
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    name: e2e (${{ matrix.browser }})
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417  # v6.3.0
        with:
          go-version-file: go.mod

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@2dec1e33f4ab2c6d5bce1b0c4607961bb1a3f7a1  # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Install tmux for workspace PTY sessions
        # The minimal Playwright image ships browsers but not tmux, which the
        # full-stack workspace e2e specs need to start real PTY sessions
        # (ubuntu-latest had it pre-installed). This is one small package, not
        # the 48MB firefox browser-deps download the container already removed.
        timeout-minutes: 5
        run: |
          apt-get update
          apt-get install -y --no-install-recommends tmux

      - name: Make $HOME owned by the current user for Firefox
        # GitHub mounts the container $HOME (/github/home) owned by the runner
        # UID while steps run as root. Firefox refuses to launch when $HOME is
        # not owned by the current user (Chromium does not check), so the
        # firefox leg fails every test at browser launch. Re-own the directory
        # itself (not its contents) so the launch check passes; HOME stays
        # /github/home, leaving the setup-go/setup-vp caches untouched.
        run: chown "$(id -u):$(id -g)" "$HOME"

      - name: Build frontend
        run: cd frontend && vp build --logLevel warn

      - name: Embed frontend
        run: |
          rm -rf internal/web/dist
          cp -r frontend/dist internal/web/dist

      - name: Build E2E server
        # -buildvcs=false: inside the Playwright container the checked-out
        # workspace has a git ownership mismatch, so VCS stamping fails with
        # "error obtaining VCS status: exit status 128". This test binary has no
        # use for stamped VCS info anyway (matches the huma-route-check target).
        run: go build -buildvcs=false -o ./cmd/e2e-server/e2e-server ./cmd/e2e-server

      - name: Run E2E tests
        run: cd frontend && vp exec -- playwright test --config=playwright-e2e.config.ts --project=${{ matrix.browser }}

      # The GitHub App setup page suite runs Desktop Chrome only, so it
      # rides the chromium leg of the matrix.
      - name: Run GitHub App setup UI E2E tests
        if: matrix.browser == 'chromium'
        run: vp run --filter @middleman/github-app-ui test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: e2e-report-${{ matrix.browser }}
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload GitHub App setup UI Playwright report
        if: failure() && matrix.browser == 'chromium'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: github-app-ui-e2e-report
          path: packages/github-app-ui/playwright-report/
          retention-days: 7

  e2e-roborev:
    runs-on: ubuntu-latest
    env:
      # Pin to post-v0.50.0 commit with OpenAPI/Huma support.
      # Update to next release tag when available.
      ROBOREV_REF: 34091063a7d9c415c35a0faba18d41952b331b0f
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: roborev-dev/roborev
          ref: ${{ env.ROBOREV_REF }}
          path: .roborev-src
          persist-credentials: false

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417  # v6.3.0
        with:
          go-version-file: go.mod

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@2dec1e33f4ab2c6d5bce1b0c4607961bb1a3f7a1  # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Run roborev E2E tests
        env:
          ROBOREV_SRC: ${{ github.workspace }}/.roborev-src
        run: ./scripts/run-roborev-e2e.sh

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: roborev-e2e-report
          path: frontend/playwright-report/
          retention-days: 7

  test_browser:
    name: frontend browser tests
    runs-on: ubuntu-latest
    # Keep browser-component tests on the same Playwright image as the full e2e
    # suite so Chromium and its OS dependencies are preinstalled instead of
    # depending on apt during the workflow.
    container: mcr.microsoft.com/playwright@sha256:57b65fdc9ceabe0ef613124c7bbe2babcf9362c4d85e382fe3b03604e84b428a  # v1.61.0-noble
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@2dec1e33f4ab2c6d5bce1b0c4607961bb1a3f7a1  # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Run frontend browser tests
        run: cd frontend && vp test run --project browser
