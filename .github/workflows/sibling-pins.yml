name: Sibling pins on main

# A pull request may pin a sibling kenn-io repository's pull request build
# while both are open, but it may not merge until every pin is on that
# sibling's main. See https://github.com/kenn-io/actions/tree/main/sibling-pins.
#
# The action reads only the candidate's dependency files. A repository
# ruleset requires this job, including in merge groups.
#
# Only a change to the code reruns it: a new commit (synchronize), or the pull
# request opening or reopening. Title, description, and base edits do not, so
# editing a pull request never cancels or repeats the check. The merge queue
# runs it again on the merge group commit, which is what gates main, so a
# retargeted base cannot merge an unchecked pin.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  sibling-pins:
    name: Sibling pins on main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check sibling pins
        uses: kenn-io/actions/sibling-pins@main
