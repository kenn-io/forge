<!doctype html>
<html lang="en" data-kit-theme="quiet">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>kenn-forge</title>
    <style>
      /* Critical theme colors inlined to prevent flash before app.css loads */
      html {
        background: #d8dee9;
      }
      html.dark {
        background: #151618;
        color-scheme: dark;
      }
    </style>
    <script>
      // Apply theme before first paint to avoid flash of wrong theme.
      (function () {
        try {
          var v = localStorage.getItem("kenn-forge-theme");
        } catch (e) {
          var v = null;
        }
        var dark = v === "dark" || v === "light" ? v === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) document.documentElement.classList.add("dark");
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
