services:
  hub:
    build:
      context: ../../..
      dockerfile: Dockerfile.dev
    command: ["./scripts/e2e/fleet/run-daemon.sh", "hub"]
    environment:
      KENN_FORGE_GO_BUILD_TAGS: kit_posthog_disabled
      KENN_FORGE_GITHUB_TOKEN_UNSET_FOR_FLEET_E2E: ""
      KENN_FORGE_FLEET_HOST_PORT: "${KENN_FORGE_FLEET_HUB_PORT:-18091}"
      SSL_CERT_FILE: /pki/cert.pem
    expose:
      - "18091"
      - "18092"
    ports:
      - "127.0.0.1:${KENN_FORGE_FLEET_HUB_PORT:-18091}:18092"
    volumes:
      - ../../..:/app
      - hub-data:/data/hub
      - fleet-pki:/pki
      - type: volume
        source: go-mod-cache
        target: /go/pkg/mod
        volume:
          nocopy: true
      - type: volume
        source: go-build-cache
        target: /root/.cache/go-build
        volume:
          nocopy: true

  member:
    build:
      context: ../../..
      dockerfile: Dockerfile.dev
    command: ["./scripts/e2e/fleet/run-daemon.sh", "member"]
    environment:
      KENN_FORGE_GO_BUILD_TAGS: kit_posthog_disabled
      KENN_FORGE_GITHUB_TOKEN_UNSET_FOR_FLEET_E2E: ""
      KENN_FORGE_FLEET_E2E_GIT_TOKEN: "fleet-e2e-token"
      SSL_CERT_FILE: /pki/cert.pem
    expose:
      - "18091"
    volumes:
      - ../../..:/app
      - member-data:/data/member
      - fleet-pki:/pki
      - type: volume
        source: go-mod-cache
        target: /go/pkg/mod
        volume:
          nocopy: true
      - type: volume
        source: go-build-cache
        target: /root/.cache/go-build
        volume:
          nocopy: true

volumes:
  hub-data:
  member-data:
  fleet-pki:
  go-mod-cache:
  go-build-cache:
