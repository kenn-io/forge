# Generated by kennlint config from go.kenn.io/kit/lint/config.
# Put repository-specific additions in the overlay file; do not edit this file by hand.
version: "2"
run:
  tests: true
  timeout: 10m
  allow-parallel-runners: true
  go: "1.27"
linters:
  default: none
  enable:
    # Correctness
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - errorlint
    - errchkjson
    - nilerr
    - nilnesserr
    - noctx
    - durationcheck
    - exhaustive
    - makezero
    - reassign
    - copyloopvar
    # Modern and idiomatic Go
    - modernize
    - intrange
    - wastedassign
    - predeclared
    - errname
    - iface
    - recvcheck
    - exptostd
    # Tests
    - testifylint
    - usetesting
    - testableexamples
    # Policy
    - forbidigo
    - importas
    - nolintlint
    - misspell
    - gocheckcompilerdirectives
    # kit analyzers (requires a custom golangci-lint build, see docs)
    - kennlint
  settings:
    errcheck:
      check-type-assertions: false
      check-blank: false
    testifylint:
      enable-all: true
      disable:
        # Identifier names do not prove that an assertion compares encoded data.
        - encoded-compare
    exhaustive:
      default-signifies-exhaustive: true
    usetesting:
      os-temp-dir: false
      context-background: false
      context-todo: true
      os-mkdir-temp: false
    gocritic:
      # Only the bug-finding checks; style and opinionated tags are noise.
      enabled-tags:
        - diagnostic
      disabled-tags:
        - style
        - performance
        - experimental
        - opinionated
      disabled-checks:
        - filepathJoin
    misspell:
      ignore-rules:
        - importas
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: true
    importas:
      no-unaliased: true
      alias:
        - pkg: github.com/stretchr/testify/assert
          alias: ""
        - pkg: github.com/stretchr/testify/require
          alias: ""
        - pkg: github.com/google/go-github/v91/github
          alias: gh
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: '^t\.(Fatal|Fatalf|Error|Errorf|Fail|FailNow)$'
          msg: Use testify assert/require helpers in tests.
        - pattern: '^testing\..+\.(Fatal|Fatalf|Error|Errorf|Fail|FailNow)$'
          msg: Use testify assert/require helpers in tests.
        - pattern: '^exec\.Command$'
          msg: Use exec.CommandContext so subprocesses honor cancellation.
        - pattern: '^http\.(Get|Post|Head|PostForm)$'
          msg: Build the request with http.NewRequestWithContext and a client with timeouts.
        - pattern: '^http\.DefaultClient$'
          msg: Construct an http.Client with explicit timeouts.
        - pattern: '^time\.Local$'
          msg: Keep stored and transported times in UTC; convert for display only.
        - pattern: '^os\.Chdir$'
          msg: Pass explicit paths or use cmd.Dir; the process working directory is shared state.
        - pattern: '^errors\.As$'
          msg: Use errors.AsType[E] for typed error extraction.
        - pattern: '^ioutil\..*$'
          msg: io/ioutil is deprecated; use io and os.
        - pattern: '^time\.LoadLocation$'
          msg: Do not add backend timezone loading for storage or API paths. Local timezone conversion belongs in the Svelte UI.
        - pattern: '^time\.FixedZone$'
          msg: Do not create backend timezone conversions outside tests.
        - pattern: '^db\.Open$'
          msg: Use internal/testutil/dbtest fixtures in tests instead of db.Open.
        - pattern: '^exec\.Command$'
          msg: Use internal/procutil.Command so Windows subprocesses do not flash console windows.
        - pattern: '^exec\.CommandContext$'
          msg: Use internal/procutil.CommandContext so Windows subprocesses do not flash console windows.
        - pattern: '^gh\.NewClient$'
          msg: Direct go-github client construction belongs in internal/github or provider startup; use provider capabilities instead.
        - pattern: '^githubv4\.New(Client|EnterpriseClient)$'
          msg: Direct GitHub GraphQL client construction belongs in internal/github or provider startup; use provider capabilities instead.
    custom:
      kennlint:
        type: module
        description: kit analyzers for test discipline, error identity, and route registration.
        original-url: go.kenn.io/kit/lint
        settings:
          errtext:
            include-tests: false
          # Schema CHECK constraints are an intentional SQLite invariant
          # (context/db-migrations.md). Historical migrations are immutable.
          # sleeptest stays off until the polling-wait conversion in
          # kenn-io/forge#1103 deletes it from this list.
          disable: [sqlcheck, sleeptest]
    govet:
      disable:
        - shadow
        - fieldalignment
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Tests may drop errors from cleanup and helper calls.
      - linters:
          - errcheck
        path: _test\.go
      # Test files start subprocesses and requests against local fixtures.
      - linters:
          - forbidigo
        path: _test\.go
        text: (exec\.Command|http\.(Get|Post|Head|PostForm)|http\.DefaultClient)
      # A main package owns process exit and may work without a caller context.
      - linters:
          - forbidigo
        path: ^(cmd/|main\.go)
        text: exec\.Command
      - linters:
          - forbidigo
        path-except: _test\.go
        text: Use internal/testutil/dbtest fixtures in tests instead of db.Open.
      - linters:
          - forbidigo
        path: internal/db/.*_test\.go
        text: Use internal/testutil/dbtest fixtures in tests instead of db.Open.
      - linters:
          - forbidigo
        path: internal/github/.*\.go
        text: Direct .* client construction belongs in internal/github or provider startup.
      - linters:
          - forbidigo
        path: cmd/kenn-forge/provider_startup\.go
        text: Direct go-github client construction belongs in internal/github or provider startup.
      - linters:
          - forbidigo
        path: kenn-forge\.go
        text: Direct go-github client construction belongs in internal/github or provider startup.
      - linters:
          - forbidigo
        path: internal/server/([a-z]+servertest/)?api_test\.go
        text: Direct GitHub GraphQL client construction belongs in internal/github or provider startup.
      # Path dispatchers and non-API muxes that tools/nohttpmux already
      # exempts: GitHub App manifest loopback, its test fake, pprof, and
      # the SPA/health outer mux (tools/nohttpmux/main.go::allowedRegistration).
      - linters:
          - kennlint
        path: ^(cmd/kenn-forge-github-app/|internal/githubapp/githubapptest/|internal/profiler/profiler\.go$|internal/server/server\.go$)
        text: nohttpmux
      - linters:
          - noctx
        path: _test\.go
        text: net/http.Get must not be called|net.Dial must not be called|\(\*net/http.Client\)\.(Get|Post) must not be called
    paths:
      - third_party$
      - builtin$
      - examples$
      - testdata$
      - frontend/node_modules
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
    - gofumpt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      - testdata$
      - frontend/node_modules
