name: CI

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: Git ref to check out
        required: false
        type: string
        default: ""
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  checks: write
  contents: read
  issues: read
  pull-requests: read
  statuses: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  detect_changes:
    name: Detect changed paths
    runs-on: ${{ github.repository == 'kenn-io/middleman' && (github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.repo.full_name == github.repository)) && 'kenn-linux-x64-public' || 'ubuntu-latest' }}
    outputs:
      backend: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.backend == 'true' || steps.filter.outputs.ci == 'true' }}
      frontend: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.frontend == 'true' || steps.filter.outputs.ci == 'true' }}
      rust: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.rust == 'true' || steps.filter.outputs.ci == 'true' }}
      e2e: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.e2e == 'true' || steps.filter.outputs.ci == 'true' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            backend:
              - '**/*.go'
              - go.mod
              - go.sum
              - internal/apiclient/generated/**
              - internal/db/migrations/**
              - internal/web/**
              - tests/integration/**
            frontend:
              - frontend/**
              - packages/**
              - package.json
              - bun.lock
              - vite.config.ts
            rust:
              - Cargo.toml
              - Cargo.lock
              - rust/**
            e2e:
              - frontend/playwright*.config.ts
              - frontend/tests/e2e/**
              - frontend/tests/e2e-full/**
              - packages/github-app-ui/playwright.config.ts
              - packages/github-app-ui/tests/**
              - scripts/e2e/**
              - scripts/run-roborev-e2e.sh
              - tests/integration/**
            ci:
              - .github/workflows/ci.yml
              - .github/docker/**
              - Makefile

  ensure_playwright_image:
    name: Ensure Playwright CI image
    runs-on: ${{ github.repository == 'kenn-io/middleman' && (github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.repo.full_name == github.repository)) && 'kenn-linux-x64-public' || 'ubuntu-latest' }}
    needs: detect_changes
    if: needs.detect_changes.outputs.backend == 'true' || needs.detect_changes.outputs.frontend == 'true' || needs.detect_changes.outputs.e2e == 'true'
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.resolve.outputs.image }}
    env:
      PLAYWRIGHT_CI_IMAGE: ghcr.io/kenn-io/middleman-playwright
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Resolve Playwright CI image
        id: resolve
        shell: bash
        env:
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail

          dockerfile=.github/docker/playwright/Dockerfile
          image_export=zstd-3-oci-force
          playwright_base_image="$(sed -n 's/^ARG PLAYWRIGHT_BASE_IMAGE=//p' "$dockerfile" | head -n 1)"
          base_digest="${playwright_base_image##*@sha256:}"
          if [[ ! "$base_digest" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::$dockerfile must define PLAYWRIGHT_BASE_IMAGE with a sha256 digest"
            exit 1
          fi

          recipe_digest="$(
            {
              sha256sum "$dockerfile"
              printf '%s\n' "$image_export"
            } | sha256sum | cut -d' ' -f1
          )"
          image_tag="${PLAYWRIGHT_CI_IMAGE}:playwright-${base_digest}-recipe-${recipe_digest:0:16}"

          inspect_output=""
          if inspect_output="$(docker buildx imagetools inspect "$image_tag" 2>&1)"; then
            echo "Reusing $image_tag"
          elif grep -Eqi 'manifest unknown|not found|no such manifest' <<<"$inspect_output"; then
            if [[ "$GITHUB_EVENT_NAME" == "pull_request" && "$PR_HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]]; then
              echo "::error::The Playwright CI image is missing and fork pull requests cannot publish private packages. Run this workflow from a trusted branch first."
              exit 1
            fi

            docker buildx build \
              --build-arg "PLAYWRIGHT_BASE_IMAGE=$playwright_base_image" \
              --file "$dockerfile" \
              --output "type=registry,compression=zstd,compression-level=3,force-compression=true,oci-mediatypes=true" \
              --platform linux/amd64 \
              --provenance=false \
              --tag "$image_tag" \
              .github/docker/playwright
          else
            echo "$inspect_output" >&2
            exit 1
          fi

          manifest_digest="$(docker buildx imagetools inspect "$image_tag" --format '{{.Manifest.Digest}}')"
          if [[ ! "$manifest_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Unable to resolve an immutable digest for $image_tag"
            exit 1
          fi

          echo "image=${PLAYWRIGHT_CI_IMAGE}@${manifest_digest}" >> "$GITHUB_OUTPUT"

  lint:
    runs-on: ${{ github.repository == 'kenn-io/middleman' && (github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.repo.full_name == github.repository)) && 'kenn-linux-x64-public' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Cache Bun package downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'package.json', 'frontend/package.json', 'packages/*/package.json') }}

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@2dec1e33f4ab2c6d5bce1b0c4607961bb1a3f7a1 # v1
        with:
          node-version-file: package.json
          cache: false
          run-install: true

      - name: Stub frontend embed dir
        run: |
          mkdir -p internal/web/dist
          echo ok > internal/web/dist/stub.html

      - name: Run frontend tooling checks
        run: ./node_modules/.bin/vp run -w check

      - name: Run guardrail checks
        run: make guardrail-check
        env:
          MIDDLEMAN_MIGRATION_PR_BASE_REF: ${{ github.event.pull_request.base.sha }}

      - uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
        with:
          version: v2.10.1

      - name: Install NilAway
        run: |
          go install go.uber.org/nilaway/cmd/nilaway@v0.0.0-20260318203545-ad240b12fb4c
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run NilAway
        run: make nilaway

  test_go:
    name: Go tests
    runs-on: ${{ github.repository == 'kenn-io/middleman' && (github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.repo.full_name == github.repository)) && 'kenn-linux-x64-public' || 'ubuntu-latest' }}
    # The runner guarantees 14 cores and can burst to 32. Seven four-thread
    # package processes can use 28 burst cores while leaving headroom for the
    # runner and compiler. The 28 GiB job does not need an artificial Go heap
    # limit; package fan-out remains bounded by GOFLAGS.
    env:
      GOMAXPROCS: "4"
      GOFLAGS: "-p=7"
    needs: detect_changes
    if: needs.detect_changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Stub frontend embed dir
        run: |
          mkdir -p internal/web/dist
          echo ok > internal/web/dist/stub.html

      - name: Run tests
        run: |
          mkdir -p tmp
          go tool gotestsum --format pkgname-and-test-fails --jsonfile=tmp/test-output.json -- ./... -shuffle=on -parallel=4

      - name: Publish unit test report
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.repo.full_name == github.repository)) }}
        uses: dorny/test-reporter@df6247429542221bc30d46a036ee47af1102c451 # v2.7.0
        with:
          name: Go unit tests
          path: tmp/test-output.json
          reporter: golang-json
          fail-on-error: false

      - name: Run live GraphQL validation
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MIDDLEMAN_LIVE_GITHUB_TESTS: "1"
        run: |
          mkdir -p tmp
          go tool gotestsum --format pkgname-and-test-fails --jsonfile=tmp/test-graphql-output.json -- ./internal/github -run TestLiveGraphQLQueriesValidateAgainstGitHub -shuffle=on

      - name: Publish live GraphQL test report
        if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: dorny/test-reporter@df6247429542221bc30d46a036ee47af1102c451 # v2.7.0
        with:
          name: Go live GraphQL tests
          path: tmp/test-graphql-output.json
          reporter: golang-json
          fail-on-error: false

      - name: Run integration tests (git-dependent)
        run: |
          mkdir -p tmp
          go tool gotestsum --format pkgname-and-test-fails --jsonfile=tmp/test-integration-output.json -- -tags integration ./... -run '^TestIntegration' -shuffle=on -parallel=4

      - name: Publish integration test report
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.repo.full_name == github.repository)) }}
        uses: dorny/test-reporter@df6247429542221bc30d46a036ee47af1102c451 # v2.7.0
        with:
          name: Go integration tests
          path: tmp/test-integration-output.json
          reporter: golang-json
          fail-on-error: false

  test_frontend:
    name: Frontend unit tests
    runs-on: ${{ github.repository == 'kenn-io/middleman' && (github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.repo.full_name == github.repository)) && 'kenn-linux-x64-public' || 'ubuntu-latest' }}
    needs: detect_changes
    if: needs.detect_changes.outputs.backend == 'true' || needs.detect_changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false

      - name: Cache Bun package downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'package.json', 'frontend/package.json', 'packages/*/package.json') }}

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@2dec1e33f4ab2c6d5bce1b0c4607961bb1a3f7a1 # v1
        with:
          node-version-file: package.json
          cache: false
          run-install: true

      - name: Run frontend unit tests
        run: cd frontend && ../node_modules/.bin/vp test run --project unit

  pty-windows:
    name: PTY tests (windows)
    runs-on: windows-latest
    needs: detect_changes
    if: needs.detect_changes.outputs.backend == 'true' || needs.detect_changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Stub frontend embed dir
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force internal/web/dist | Out-Null
          Set-Content -Path internal/web/dist/stub.html -Value ok

      - name: Run Go PTY owner tests
        run: go test ./internal/ptyowner/... -shuffle=on

      - name: Run localruntime PTY owner smoke test
        run: go test ./internal/workspace/localruntime -run TestManagerLaunchUsesPtyOwnerWhenConfigured -shuffle=on

      - name: Run Rust PTY manager server e2e tests
        run: go test ./internal/server -run 'TestWorkspaceCreatesRustPtyManagerSessionE2E|TestWorkspaceRuntimeLaunchesRustPtyManagerSessionE2E' -shuffle=on

      - name: Run Rust PTY manager tests
        run: cargo test -p middleman-pty-manager

  race:
    name: go test -race
    runs-on: ${{ github.repository == 'kenn-io/middleman' && (github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.repo.full_name == github.repository)) && 'kenn-linux-x64-public' || 'ubuntu-latest' }}
    needs: detect_changes
    if: needs.detect_changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Stub frontend embed dir
        run: |
          mkdir -p internal/web/dist
          echo ok > internal/web/dist/stub.html

      - name: Run tests (race detector)
        run: |
          mkdir -p tmp
          go tool gotestsum --format pkgname-and-test-fails --jsonfile=tmp/test-race-output.json --jsonfile-timing-events=tmp/test-race-timing-events.json -- -race ./... -shuffle=on -timeout 20m

      - name: Summarize race test timings
        if: ${{ !cancelled() && hashFiles('tmp/test-race-output.json') != '' }}
        run: |
          {
            echo "## Slowest race packages"
            echo
            echo '```'
            jq -r '
              select(.Action == "pass" and .Package and (.Test | not) and .Elapsed)
              | "\(.Elapsed)s\t\(.Package)"
            ' tmp/test-race-timing-events.json | sort -rn | head -n 30
            echo '```'
            echo
            echo "## Slowest race tests"
            echo
            echo '```'
            jq -r '
              select(
                (.Action == "pass" or .Action == "fail" or .Action == "skip")
                and .Package
                and .Test
                and .Elapsed
              )
              | "\(.Elapsed)s\t\(.Package)\t\(.Test)"
            ' tmp/test-race-timing-events.json | sort -rn | head -n 40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish race test report
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.repo.full_name == github.repository)) }}
        uses: dorny/test-reporter@df6247429542221bc30d46a036ee47af1102c451 # v2.7.0
        with:
          name: Go race tests
          path: tmp/test-race-output.json
          reporter: golang-json
          fail-on-error: false

      - name: Upload race timing artifacts
        if: ${{ !cancelled() && hashFiles('tmp/test-race-output.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: go-race-timing
          path: |
            tmp/test-race-output.json
            tmp/test-race-timing-events.json
          retention-days: 7

  build:
    runs-on: ${{ github.repository == 'kenn-io/middleman' && (github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.repo.full_name == github.repository)) && 'kenn-linux-x64-public' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Cache Bun package downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'package.json', 'frontend/package.json', 'packages/*/package.json') }}

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@2dec1e33f4ab2c6d5bce1b0c4607961bb1a3f7a1 # v1
        with:
          node-version-file: package.json
          cache: false
          run-install: true

      - name: Build frontend
        run: node scripts/build-frontend.mjs

      - name: Embed frontend
        run: |
          rm -rf internal/web/dist
          cp -r frontend/dist internal/web/dist

      - name: Build binary
        run: go build -o middleman ./cmd/middleman

  e2e-mock:
    runs-on: ${{ github.repository == 'kenn-io/middleman' && (github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.repo.full_name == github.repository)) && 'kenn-linux-x64-public' || 'ubuntu-latest' }}
    needs: [detect_changes, ensure_playwright_image]
    if: needs.detect_changes.outputs.frontend == 'true' || needs.detect_changes.outputs.e2e == 'true'
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.ensure_playwright_image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    name: e2e mock (${{ matrix.browser }})
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false

      - name: Restore Bun package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/local/install/cache
          key: browser-bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/docker/playwright/Dockerfile', 'bun.lock') }}
          restore-keys: |
            browser-bun-${{ runner.os }}-${{ runner.arch }}-

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Make $HOME owned by the current user for Firefox
        if: matrix.browser == 'firefox'
        run: chown "$(id -u):$(id -g)" "$HOME"

      - name: Run mock E2E tests
        run: cd frontend && ../node_modules/.bin/vp exec -- playwright test --config=playwright.config.ts --project=${{ matrix.browser }}

      - name: Upload mock Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-mock-report-${{ matrix.browser }}
          path: frontend/playwright-report/
          retention-days: 7

  e2e:
    runs-on: ${{ github.repository == 'kenn-io/middleman' && (github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.repo.full_name == github.repository)) && 'kenn-linux-x64-public' || 'ubuntu-latest' }}
    needs: [detect_changes, ensure_playwright_image]
    if: needs.detect_changes.outputs.backend == 'true' || needs.detect_changes.outputs.frontend == 'true' || needs.detect_changes.outputs.e2e == 'true'
    permissions:
      contents: read
      packages: read
    # The prerequisite job resolves a private, digest-pinned Playwright image
    # with Bun, Vite+, and tmux preinstalled, so browser jobs skip repeated
    # toolchain bootstrap downloads and never depend on Ubuntu mirrors.
    container:
      image: ${{ needs.ensure_playwright_image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    name: e2e (${{ matrix.browser }})
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Bun package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/local/install/cache
          key: browser-bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/docker/playwright/Dockerfile', 'bun.lock') }}
          restore-keys: |
            browser-bun-${{ runner.os }}-${{ runner.arch }}-

      - name: Install frontend dependencies
        # Restore only Bun's package cache; materialize node_modules from the
        # checked-out lockfile inside this job container.
        run: bun install --frozen-lockfile

      - name: Make $HOME owned by the current user for Firefox
        # GitHub mounts the container $HOME (/github/home) owned by the runner
        # UID while steps run as root. Firefox refuses to launch when $HOME is
        # not owned by the current user (Chromium does not check), so the
        # firefox leg fails every test at browser launch. Re-own the directory
        # itself (not its contents) so the launch check passes; HOME stays
        # /github/home, leaving the setup-go cache untouched.
        run: chown "$(id -u):$(id -g)" "$HOME"

      - name: Build frontend
        run: node scripts/build-frontend.mjs

      - name: Embed frontend
        run: |
          rm -rf internal/web/dist
          cp -r frontend/dist internal/web/dist

      - name: Build E2E server
        # -buildvcs=false: inside the Playwright container the checked-out
        # workspace has a git ownership mismatch, so VCS stamping fails with
        # "error obtaining VCS status: exit status 128". This test binary has no
        # use for stamped VCS info anyway (matches the huma-route-check target).
        run: go build -buildvcs=false -o ./cmd/e2e-server/e2e-server ./cmd/e2e-server

      - name: Run E2E tests
        run: cd frontend && ../node_modules/.bin/vp exec -- playwright test --config=playwright-e2e.config.ts --project=${{ matrix.browser }}

      # The GitHub App setup page suite runs Desktop Chrome only, so it
      # rides the chromium leg of the matrix.
      - name: Run GitHub App setup UI E2E tests
        if: matrix.browser == 'chromium'
        run: ./node_modules/.bin/vp run --filter @middleman/github-app-ui test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-report-${{ matrix.browser }}
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload GitHub App setup UI Playwright report
        if: failure() && matrix.browser == 'chromium'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: github-app-ui-e2e-report
          path: packages/github-app-ui/playwright-report/
          retention-days: 7

  e2e-roborev:
    runs-on: ${{ github.repository == 'kenn-io/middleman' && (github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.repo.full_name == github.repository)) && 'kenn-linux-x64-public' || 'ubuntu-latest' }}
    needs: detect_changes
    if: needs.detect_changes.outputs.backend == 'true' || needs.detect_changes.outputs.frontend == 'true' || needs.detect_changes.outputs.e2e == 'true'
    env:
      # Pin to v0.61.2, the first release with panel reviews (panel_summary,
      # omit_prompt, first_started_at).
      ROBOREV_REF: 4238df4685524fa0b4e308014ae120e677e7b6ed
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: roborev-dev/roborev
          ref: ${{ env.ROBOREV_REF }}
          path: .roborev-src
          persist-credentials: false

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Cache Bun package downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'package.json', 'frontend/package.json', 'packages/*/package.json') }}

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@2dec1e33f4ab2c6d5bce1b0c4607961bb1a3f7a1 # v1
        with:
          node-version-file: package.json
          cache: false
          run-install: true

      - name: Run roborev E2E tests
        env:
          ROBOREV_SRC: ${{ github.workspace }}/.roborev-src
        run: ./scripts/run-roborev-e2e.sh

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: roborev-e2e-report
          path: frontend/playwright-report/
          retention-days: 7

  test_browser:
    name: frontend browser tests
    runs-on: ${{ github.repository == 'kenn-io/middleman' && (github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.repo.full_name == github.repository)) && 'kenn-linux-x64-public' || 'ubuntu-latest' }}
    timeout-minutes: 15
    needs: [detect_changes, ensure_playwright_image]
    if: needs.detect_changes.outputs.backend == 'true' || needs.detect_changes.outputs.frontend == 'true'
    permissions:
      contents: read
      packages: read
    # Keep browser-component tests on the same Playwright image as the full e2e
    # suite so Chromium and its OS dependencies are preinstalled instead of
    # depending on apt during the workflow.
    container:
      image: ${{ needs.ensure_playwright_image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false

      - name: Restore Bun package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/local/install/cache
          key: browser-bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/docker/playwright/Dockerfile', 'bun.lock') }}
          restore-keys: |
            browser-bun-${{ runner.os }}-${{ runner.arch }}-

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Run frontend browser tests
        run: cd frontend && ../node_modules/.bin/vp test run --project browser
