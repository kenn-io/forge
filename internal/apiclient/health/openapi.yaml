components:
  schemas:
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    HealthResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/HealthResponse.json
          format: uri
          readOnly: true
          type: string
        status:
          type: string
      required:
        - status
      type: object
    ProblemError:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/ProblemError.json
          format: uri
          readOnly: true
          type: string
        code:
          description: Machine-readable error code. Stable across occurrences.
          enum:
            - badRequest
            - branchConflict
            - branchInUse
            - branchProtected
            - commentNotFound
            - conflict
            - destinationExists
            - forbidden
            - gitCredentialUnavailable
            - hookFailed
            - hubUnavailable
            - internalError
            - issueNotFound
            - mutationOutcomeUnknown
            - notFound
            - payloadTooLarge
            - projectNotFound
            - pullNotFound
            - rateLimited
            - repoNotFound
            - resyncRequired
            - serviceUnavailable
            - settingsUnavailable
            - spokePreparationInProgress
            - toolMissing
            - toolUnauthenticated
            - unauthorized
            - unsupportedCapability
            - upstreamError
            - validationError
            - workspaceAlreadyExists
            - workspaceDeletionInProgress
            - workspaceDirectoryNotReusable
            - workspaceNotFound
            - workspaceSetupInProgress
            - worktreeDirty
          examples:
            - badRequest
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        details:
          additionalProperties: {}
          description: Machine-readable error context, keyed by code-specific conventions.
          type: object
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type: array
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      required:
        - code
      type: object
info:
  title: kenn-forge health
  version: 0.1.0
openapi: 3.1.0
paths:
  /healthz:
    get:
      operationId: get-healthz
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemError"
          description: Error
      summary: Get healthz
  /livez:
    get:
      operationId: get-livez
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemError"
          description: Error
      summary: Get livez
