name: Sibling pins on main

# A pull request may pin a sibling kenn-io repository's pull request build
# while both are open, but it may not merge until every pin is on that
# sibling's main. See https://github.com/kenn-io/actions/tree/main/sibling-pins.
#
# The action reads only the candidate's dependency files. A repository
# ruleset requires this job, including in merge groups.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

# A push or base change replaces the merge ref, so it cancels the stale run.
# A title or description edit leaves the merge ref alone; it runs in its own
# group so it neither cancels nor is cancelled by the run it duplicates.
concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name != 'pull_request' || (github.event.action == 'edited' && !github.event.changes.base)) && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  sibling-pins:
    name: Sibling pins on main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check sibling pins
        uses: kenn-io/actions/sibling-pins@main
