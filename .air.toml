root = "."
tmp_dir = "tmp"

[build]
cmd = "./scripts/dev-backend-build.sh"
entrypoint = "./tmp/kenn-forge"
delay = 500
exclude_dir = [
  "frontend",
  "internal/web/dist",
  "internal/apiclient/generated",
  "node_modules",
  "target",
  "tmp",
  "vendor",
  ".git",
]
include_ext = ["go", "tpl", "tmpl", "html"]
include_file = ["go.mod", "go.sum", "scripts/dev-backend-build.sh"]
stop_on_error = false
send_interrupt = true
kill_delay = "150s"

[screen]
clear_on_rebuild = false
