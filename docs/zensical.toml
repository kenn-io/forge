[project]
site_name = "kenn-forge"
site_description = "Local-first maintainer console"
site_author = "Kenn Software LLC"
copyright = 'Copyright &copy; 2026 <a href="https://kenn.io">Kenn Software LLC</a>. Elastic License 2.0.'
docs_dir = "docs"
site_dir = "site"
repo_url = "https://github.com/kenn-io/forge"
repo_name = "kenn-io/forge"
extra_css = ["stylesheets/extra.css"]
use_directory_urls = true
nav = [
  {"Overview" = "index.md"},
  {"Quick start" = "quickstart.md"},
  {"Workflows" = [
    {"Overview" = "workflows.md"},
    {"Follow activity" = "workflows/activity.md"},
    {"Triage issues" = "workflows/issue-triager.md"},
    {"Review pull requests" = "workflows/code-reviewer.md"},
    {"Browse repositories" = "workflows/repositories.md"},
    {"Work in local sessions" = "workflows/workspaces.md"},
    {"Read and edit Docs" = "workflows/docs.md"},
  ]},
  {"Integrations" = "integrations.md"},
  {"Configuration" = "configuration.md"},
  {"Commands" = "commands.md"},
  {"Advanced / experimental" = [
    {"Fleet" = "federated-fleet.md"},
  ]},
  {"Archive" = "archive.md"},
  {"Troubleshooting" = "troubleshooting.md"},
]

[project.extra]
homepage = "/"

[project.theme]
custom_dir = "docs/overrides"
variant = "modern"
favicon = "assets/favicon.svg"
features = [
  "navigation.instant",
  "navigation.instant.progress",
  "navigation.tracking",
  "navigation.sections",
  "navigation.path",
  "content.code.copy",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle = { icon = "material/brightness-auto", name = "Switch to light mode" }

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle = { icon = "material/weather-night", name = "Switch to dark mode" }

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle = { icon = "material/brightness-auto", name = "Use system theme" }

[project.theme.icon]
repo = "fontawesome/brands/github"
edit = "lucide/pencil"
view = "lucide/file-code"

[project.markdown_extensions.admonition]

[project.markdown_extensions.attr_list]

[project.markdown_extensions.md_in_html]

[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
pygments_lang_class = true

[project.markdown_extensions.pymdownx.inlinehilite]

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.markdown_extensions.tables]

[project.markdown_extensions.toc]
permalink = true
