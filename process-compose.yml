version: "0.5"
is_strict: true

shell:
  shell_command: "sh"
  # Not a login shell: on macOS a login sh runs /etc/profile, which calls
  # path_helper and moves the system directories ahead of the user's own
  # PATH. The daemon started here hands its environment to every agent it
  # launches, so keep the PATH process-compose was started with.
  shell_argument: "-c"

processes:
  git-fetch:
    description: "Refresh remote refs every 15 minutes while on main"
    namespace: dev
    log_location: "tmp/logs/git-fetch-process-compose.log"
    command: |
      while true; do
        if [ "$(git branch --show-current)" = "main" ]; then
          git fetch || echo "git fetch failed; retrying in 15 minutes" >&2
        fi
        sleep 900
      done

  backend:
    description: "Go backend with live reload on 127.0.0.1:8091"
    namespace: dev
    log_location: "tmp/logs/backend-process-compose.log"
    command: |
      mkdir -p tmp/logs
      export KENN_FORGE_LOG_LEVEL="${KENN_FORGE_LOG_LEVEL:-debug}"
      export KENN_FORGE_LOG_FILE="${KENN_FORGE_LOG_FILE:-tmp/logs/backend-dev.log}"
      export KENN_FORGE_LOG_STDERR_LEVEL="${KENN_FORGE_LOG_STDERR_LEVEL:-info}"
      export KENN_FORGE_DEV_RESTART=1
      if ! make frontend || ! ./scripts/dev-backend-build.sh; then
        [ -x ./tmp/kenn-forge ] || exit 1
        printf 'Build failed; running the last successful backend build\n' >&2
      fi
      if [ -n "${KENN_FORGE_CONFIG:-}" ]; then
        exec ./tmp/kenn-forge serve -config "$KENN_FORGE_CONFIG" ${BACKEND_ARGS:-}
      else
        exec ./tmp/kenn-forge serve ${BACKEND_ARGS:-}
      fi
    watch:
      debounce: 1s
      paths:
        - path: ./cmd
          include: ["*.go", "*.tpl", "*.tmpl", "*.html"]
        - path: ./internal
          include: ["*.go", "*.tpl", "*.tmpl", "*.html"]
          exclude: ["web/dist/**", "apiclient/*/client.go"]
        - path: ./githubapp
          include: ["*.go"]
        - path: ./landedwork
          include: ["*.go"]
        - path: ./platform
          include: ["*.go"]
        - path: ./worklist
          include: ["*.go"]
        # File watches traverse their parent; prune local worktrees and caches.
        - path: ./go.mod
          exclude: [".*/**", "tmp/**"]
        - path: ./go.sum
          exclude: [".*/**", "tmp/**"]
        - path: ./scripts/dev-backend-build.sh
    availability:
      restart: always
      backoff_seconds: 5
    shutdown:
      signal: 15
      timeout_seconds: 150
    # process-compose kills the backend when readiness exhausts its failures.
    # The first start after a pull runs the frontend build and a cold Go build
    # before the server listens, which can take several minutes.
    readiness_probe:
      http_get:
        host: 127.0.0.1
        scheme: http
        path: /healthz
        port: 8091
      initial_delay_seconds: 5
      period_seconds: 5
      timeout_seconds: 3
      success_threshold: 1
      failure_threshold: 120

  frontend:
    description: "Vite frontend dev server on 127.0.0.1:5174"
    namespace: dev
    log_location: "tmp/logs/frontend-process-compose.log"
    environment:
      - KENN_FORGE_API_ERROR_DEBUG=1
    command: "exec sh ./scripts/dev-stack-frontend.sh"
    watch:
      debounce: 1s
      paths:
        - path: ./bun.lock
          exclude: [".*/**", "tmp/**"]
        - path: ./package.json
          exclude: [".*/**", "tmp/**"]
        - path: ./frontend/package.json
    availability:
      restart: always
      backoff_seconds: 5
    shutdown:
      signal: 2
      timeout_seconds: 10
    readiness_probe:
      http_get:
        host: 127.0.0.1
        scheme: http
        path: /
        port: 5174
      initial_delay_seconds: 5
      period_seconds: 5
      timeout_seconds: 3
      success_threshold: 1
      failure_threshold: 120
